<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Array Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🎵 Array Music Player</h1>
      <p class="subtitle">A real-world application powered by a JavaScript array</p>
    </header>

    <!-- ========== MUSIC PLAYER ========== -->
    <section class="player card">
      <div class="now-playing">
        <div class="disc" id="disc">
          <img id="discCover" class="disc-cover" alt="" />
          <span class="disc-note" id="discNote">♪</span>
        </div>
        <div>
          <h2 id="trackTitle">No song loaded</h2>
          <p id="trackArtist">—</p>
          <small id="trackIndex"></small>
        </div>
      </div>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1" />
        <span id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffleBtn" title="Shuffle playlist order">🔀</button>
        <button id="prevBtn" title="Previous">⏮</button>
        <button id="playBtn" class="primary" title="Play / Pause">▶</button>
        <button id="nextBtn" title="Next">⏭</button>
        <button id="repeatBtn" title="Repeat playlist">🔁</button>
      </div>

      <div class="volume-row">
        <span>🔈</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" />
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>

    <!-- playlist -->
    <section class="card">
      <div class="list-header">
        <h3>Playlist</h3>
        <div class="list-tools">
          <input type="search" id="search" placeholder="Search songs..." />
          <button id="sortBtn">Sort A–Z</button>
        </div>
      </div>
      <p class="stats" id="stats"></p>
      <ul id="playlist" class="playlist"></ul>
    </section>

    <!-- add song -->
    <section class="card">
      <h3>Add a song</h3>
      <form id="addForm" class="add-form">
        <input type="text" id="newTitle" placeholder="Title" required />
        <input type="text" id="newArtist" placeholder="Artist" required />
        <input type="url" id="newUrl" placeholder="Audio URL (.mp3)" />
        <input type="url" id="newCover" placeholder="Cover image URL (optional)" />
        <label class="file-label">
          or choose an audio file
          <input type="file" id="newFile" accept="audio/*" />
        </label>
        <label class="file-label">
          or choose a cover image
          <input type="file" id="newCoverFile" accept="image/*" />
        </label>
        <button type="submit" class="primary">Add to playlist</button>
      </form>
    </section>

    <!-- live array view -->
    <section class="card">
      <h3>Live view of the array</h3>
      <p class="hint">This is the actual <code>playlist</code> array, updated after every operation.</p>
      <pre id="arrayView"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
